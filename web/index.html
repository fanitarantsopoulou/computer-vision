<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Γνωρίζω την Ελλάδα</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="scene"></div>

      <div id="controls" data-ui hidden>
        <button id="c-pause" type="button" title="Παύση (Space)">⏸</button>
        <button id="c-restart" type="button" title="Από την αρχή (R)">↻</button>
        <button id="c-skip" type="button" title="Επόμενη ερώτηση (N)">⏭</button>
        <button id="c-stop" type="button" title="Τέλος (Esc)">⏹</button>
      </div>
      <div id="pause" data-ui hidden>
        <h2>⏸ Παύση</h2>
        <button id="p-resume" type="button">▶ Συνέχεια</button>
        <button id="p-restart" type="button">↻ Από την αρχή</button>
        <button id="p-stop" type="button">⏹ Τέλος</button>
      </div>

      <div id="hud" hidden><span id="score">⭐ 0</span></div>
      <div id="clouds"></div>

      <aside id="map-card">
        <svg id="map" aria-label="Χάρτης της Ελλάδας"></svg>
        <p id="map-caption">Πού βρίσκεται;</p>
      </aside>

      <div id="avatar" hidden></div>
      <div id="bubble" hidden></div>
      <div id="prompt" hidden><span class="small">Νομός</span><strong id="prefecture"></strong></div>

      <div id="idle">
        <h1>Γνωρίζω την Ελλάδα</h1>
        <p class="wave">👋 Πλησίασε για να παίξουμε!</p>
        <p id="status" class="status">Φορτώνει η κάμερα…</p>
      </div>

      <div id="end" hidden>
        <h2 id="end-title"></h2>
        <p id="end-score"></p>
        <p id="end-stars" aria-hidden="true"></p>
        <div class="btns" data-ui>
          <button id="e-replay" type="button">↻ Παίξε ξανά</button>
          <button id="e-next" type="button">Επόμενος μαθητής</button>
        </div>
      </div>

      <div id="setup" data-ui>
        <label class="field">Όνομα μαθητή
          <input id="pupil-name" type="text" maxlength="20" placeholder="(προαιρετικό)" autocomplete="off" />
        </label>
        <div class="seg" role="group" aria-label="Αγόρι ή κορίτσι">
          <button type="button" data-avatar="girl">👧 Κορίτσι</button>
          <button type="button" data-avatar="boy">👦 Αγόρι</button>
        </div>
        <label class="field inline">Ερωτήσεις
          <input id="rounds" type="number" min="1" max="52" step="1" inputmode="numeric" />
        </label>
      </div>

      <div id="cursor" hidden></div>
      <video id="cam" playsinline muted></video>

      <button id="gear" data-ui title="Ρυθμίσεις δασκάλου (T)" aria-label="Ρυθμίσεις δασκάλου">⚙</button>
      <div id="settings" data-ui hidden>
        <h2>Ρυθμίσεις δασκάλου</h2>
        <label class="row">Απόσταση έναρξης
          <input id="set-distance" type="range" min="0.06" max="0.3" step="0.01" />
          <span class="hint">κοντά ← → μακριά</span>
        </label>
        <label class="row">Κάμερα
          <select id="set-camera"></select>
        </label>
        <label class="row inline"><input id="set-preview" type="checkbox" /> Δείξε προεπισκόπηση κάμερας</label>
        <p class="hint">Η εικόνα της κάμερας δεν εμφανίζεται ποτέ στο παιχνίδι ούτε αποθηκεύεται.</p>
        <button id="set-close">Κλείσιμο</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
